<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fetih</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0b171d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="description" content="Fetih: kıtaları fethet, krallığını kur.">
<link rel="icon" type="image/png" href="favicon-48.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
/* ===== Görünüm (renkler, düzen, panel, oyun sonu ekranı) ===== */
:root {
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top,0px);
  padding-bottom: env(safe-area-inset-bottom,0px);
  --bg: #eef3f5;
  --sea: #bcd6e2;
  --ink: #12252e;
  --card: #fff;
}
@media (prefers-color-scheme:dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b171d;
    --sea: #12303d;
    --ink: #e6eef2;
    --card: #16262e;
  }
}
:root[data-theme="dark"] {
  --bg: #0b171d;
  --sea: #12303d;
  --ink: #e6eef2;
  --card: #16262e;
}
html {
  scroll-padding-top: env(safe-area-inset-top,0px);
}
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: Bahnschrift,"Segoe UI",system-ui,sans-serif;
}
main {
  max-width: 980px;
  margin: 0 auto;
  padding: 12px;
}
h1 {
  font-size: 22px;
  margin: 4px 0 8px;
  letter-spacing: .5px;
}
#chips {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  margin-bottom: 8px;
}
#chips span {
  background: var(--card);
  border-left: 6px solid var(--c);
  padding: 4px 10px;
  border-radius: 4px;
  font-size: 14px;
}
#chips span.on {
  outline: 2px solid var(--c);
}
canvas {
  width: 100%;
  height: auto;
  display: block;
  background: var(--sea);
  border-radius: 10px;
  touch-action: manipulation;
  -webkit-touch-callout: none;
  user-select: none;
  -webkit-user-select: none;
}
#mw {
  position: relative;
  overflow: hidden;
  border-radius: 10px;
}
#zm {
  position: relative;
  transform-origin: 0 0;
  will-change: transform;
}
#zr {
  position: absolute;
  right: 8px;
  top: 8px;
  z-index: 6;
  flex: none;
  padding: 6px 12px;
  font-size: 13px;
}
#m {
  position: relative;
  z-index: 1;
  background: transparent;
}
#wv {
  position: absolute;
  left: 0;
  top: 0;
  width: 100%;
  height: 100%;
  z-index: 0;
  pointer-events: none;
}
#pop {
  position: fixed;
  z-index: 50;
  max-height: calc(100vh - 16px);
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 6px;
  min-width: 140px;
  padding: 8px;
  border-radius: 10px;
  background: var(--card);
  box-shadow: 0 6px 20px rgba(0,0,0,.35);
}
#pop[hidden] {
  display: none;
}
#pop {
  animation: popIn .16s ease-out;
}
@keyframes popIn {
  from {
    opacity: 0;
    margin-top: 8px;
  }
  to {
    opacity: 1;
    margin-top: 0;
  }
}
#pop b {
  font-size: 14px;
  padding: 0 2px;
}
#pop span {
  font-size: 13px;
  max-width: 190px;
}
#pop button {
  padding: 10px;
}
/* Yapı paneli sekmeleri */
#pop .pt-tabs {
  display: flex;
  gap: 4px;
  min-width: 232px;
  padding: 3px;
  border-radius: 10px;
  background: rgba(127, 140, 150, .16);
}
#pop .pt-tabs button {
  position: relative;
  flex: 1;
  padding: 7px 2px 6px;
  font-size: 12.5px;
  line-height: 1.15;
  border-radius: 8px;
  background: transparent;
  color: var(--ink);
  opacity: .75;
}
#pop .pt-tabs button.on {
  background: var(--ink);
  color: var(--bg);
  opacity: 1;
}
#pop .pt-tabs i {
  display: block;
  font-style: normal;
  font-size: 16px;
  margin-bottom: 1px;
}
#pop .pt-tabs em {
  position: absolute;
  top: 2px;
  right: 4px;
  min-width: 15px;
  padding: 0 3px;
  border-radius: 8px;
  background: #3fb98a;
  color: #fff;
  font-style: normal;
  font-size: 10.5px;
  line-height: 15px;
}
#st {
  margin: 10px 0 2px;
  font-size: 16px;
  font-weight: 600;
  min-height: 22px;
}
#log {
  font-size: 14px;
  opacity: .75;
  min-height: 20px;
  margin-bottom: 10px;
}
.row {
  display: flex;
  gap: 8px;
}
button {
  flex: 1;
  padding: 12px;
  font: inherit;
  font-weight: 600;
  border: 0;
  border-radius: 8px;
  background: var(--ink);
  color: var(--bg);
}
button:disabled {
  opacity: .35;
}
button {
  transition: transform .08s,filter .15s;
}
button:active:not(:disabled) {
  transform: scale(.96);
  filter: brightness(1.15);
}
#eov {
  position: fixed;
  inset: 0;
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: center;
  background: radial-gradient(ellipse at 50% 45%,rgba(60,42,6,.86),rgba(8,14,18,.94) 70%);
  animation: eoFade .6s ease-out;
}
#eov.lose {
  background: radial-gradient(ellipse at 50% 45%,rgba(70,16,24,.88),rgba(8,10,14,.95) 70%);
}
#eocf {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  background: transparent;
  border-radius: 0;
}
.eo-in {
  position: relative;
  text-align: center;
  padding: 24px;
  max-width: 92vw;
  color: #fff;
}
.eo-mark {
  font-size: clamp(46px,12vw,84px);
  line-height: 1;
  color: #ffd36b;
  text-shadow: 0 0 28px rgba(255,200,80,.7);
  animation: eoDrop .9s cubic-bezier(.2,1.4,.4,1) both;
}
#eov.lose .eo-mark {
  color: #ff8a8a;
  text-shadow: 0 0 24px rgba(255,90,90,.6);
}
#eov h2 {
  margin: 10px 0 8px;
  font-size: clamp(30px,8.5vw,68px);
  line-height: 1.05;
  letter-spacing: .5px;
  background: linear-gradient(180deg,#fff6d2,#ffd36b 45%,#e8a21a);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  filter: drop-shadow(0 4px 18px rgba(255,190,60,.45));
  animation: eoZoom 1s cubic-bezier(.2,1.3,.4,1) .15s both,eoGlow 2.4s ease-in-out 1.2s infinite;
}
#eov.lose h2 {
  background: linear-gradient(180deg,#fff,#ffb3b3 50%,#e5566d);
  -webkit-background-clip: text;
  background-clip: text;
  filter: drop-shadow(0 4px 18px rgba(229,86,109,.4));
}
#eov p {
  margin: 0 0 26px;
  font-size: clamp(15px,3.8vw,19px);
  opacity: .85;
  animation: eoFade .8s ease-out .7s both;
}
#eore {
  width: 78px;
  height: 78px;
  border-radius: 50%;
  border: none;
  background: #f2b134;
  color: #12252e;
  font-size: 40px;
  font-weight: 700;
  cursor: pointer;
  box-shadow: 0 0 0 6px rgba(242,177,52,.25),0 10px 30px rgba(0,0,0,.4);
  animation: eoZoom .7s cubic-bezier(.2,1.4,.4,1) 1s both;
}
#eore span {
  display: inline-block;
  transition: transform .4s;
}
#eore:hover span {
  transform: rotate(-180deg);
}
#eore:focus-visible {
  outline: 3px solid #fff;
  outline-offset: 4px;
}
#eov small {
  display: block;
  margin-top: 10px;
  font-size: 14px;
  opacity: .75;
  animation: eoFade .6s ease-out 1.3s both;
}
@keyframes eoFade {
  from {
    opacity: 0;
  }
  to {
    opacity: 1;
  }
}
@keyframes eoZoom {
  from {
    opacity: 0;
    transform: scale(.4);
  }
  to {
    opacity: 1;
    transform: none;
  }
}
@keyframes eoDrop {
  from {
    opacity: 0;
    transform: translateY(-60px) scale(.6);
  }
  to {
    opacity: 1;
    transform: none;
  }
}
@keyframes eoGlow {
  50% {
    filter: drop-shadow(0 4px 30px rgba(255,200,80,.85));
  }
}
@media (prefers-reduced-motion:reduce) {
  #eov,#eov * {
    animation: none!important;
  }
}
#bn {
  position: absolute;
  left: 50%;
  top: 10px;
  z-index: 7;
  pointer-events: none;
  padding: 7px 16px;
  border-radius: 999px;
  font-weight: 700;
  font-size: 15px;
  box-shadow: 0 4px 14px rgba(0,0,0,.35);
  opacity: 0;
  transform: translateX(-50%);
  white-space: nowrap;
}
#bn.on {
  animation: bnIn 1.5s ease-out;
}
@keyframes bnIn {
  0% {
    opacity: 0;
    top: -30px;
  }
  15% {
    opacity: 1;
    top: 10px;
  }
  75% {
    opacity: 1;
    top: 10px;
  }
  100% {
    opacity: 0;
    top: 4px;
  }
}
button.on {
  background: #f2b134;
  color: #12252e;
}
button:focus-visible {
  outline: 3px solid #f2b134;
  outline-offset: 2px;
}

/* ===== Ana menü (hareketli) ===== */
#menu {
  position: fixed;
  inset: 0;
  z-index: 90;
  display: flex;
  flex-direction: column;
  align-items: center;
  background: #0b171d;
  color: #f4efe2;
  overflow: hidden;
}
#menu[hidden] {
  display: none;
}
#menu.leaving {
  animation: menuOut .6s ease-in forwards;
  pointer-events: none;
}
#menu.leaving #mnbg {
  animation: bgZoom .6s ease-in forwards;
}
@keyframes menuOut {
  to { opacity: 0; }
}
@keyframes bgZoom {
  to { transform: scale(1.35); filter: brightness(1.4); }
}
#mnbg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  background: #0b171d;
  border-radius: 0;
}
.mn-vig {
  position: absolute;
  inset: 0;
  pointer-events: none;
  background:
    radial-gradient(ellipse 90% 55% at 50% 38%, rgba(6, 14, 20, 0) 30%, rgba(6, 14, 20, .55) 100%),
    linear-gradient(180deg, rgba(6, 14, 20, .75) 0%, rgba(6, 14, 20, .15) 26%, rgba(6, 14, 20, 0) 42%, rgba(6, 14, 20, .55) 62%, rgba(6, 14, 20, .95) 100%);
}
.mn-top {
  position: relative;
  padding-top: max(6vh, 24px);
  text-align: center;
}
.mn-crest {
  display: block;
  width: 70px;
  height: 81px;
  margin: 0 auto 4px;
  filter: drop-shadow(0 8px 16px rgba(0, 0, 0, .55));
  animation: crestIn .9s cubic-bezier(.2, 1.4, .4, 1) both, crestFloat 4s ease-in-out .9s infinite;
}
@keyframes crestIn {
  from { opacity: 0; transform: translateY(-50px) scale(.5) rotate(-20deg); }
}
@keyframes crestFloat {
  0%, 100% { transform: translateY(0) rotate(-2deg); }
  50% { transform: translateY(-7px) rotate(2deg); }
}
.mn-title {
  margin: 0;
  font-size: clamp(56px, 18vw, 84px);
  line-height: .95;
  letter-spacing: 3px;
  font-weight: 800;
  filter: drop-shadow(0 4px 0 #7a4c0c) drop-shadow(0 12px 22px rgba(0, 0, 0, .65));
}
.mn-title span {
  display: inline-block;
  background: linear-gradient(105deg, #e8a21a 0%, #ffd36b 35%, #fff8dc 50%, #ffd36b 65%, #e8a21a 100%);
  background-size: 300% 100%;
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  animation: ltrIn .8s cubic-bezier(.2, 1.6, .4, 1) calc(.35s + var(--i) * .1s) both, shine 4s linear calc(1.6s + var(--i) * .08s) infinite;
}
@keyframes ltrIn {
  from { opacity: 0; transform: translateY(-70px) scale(1.6) rotate(calc(var(--i) * 9deg - 18deg)); }
}
@keyframes shine {
  0% { background-position: 100% 0; }
  40%, 100% { background-position: -100% 0; }
}
.mn-tag {
  margin: 10px 0 0;
  font-size: 15px;
  letter-spacing: .4px;
  opacity: .9;
  text-shadow: 0 2px 8px rgba(0, 0, 0, .8);
  animation: tagIn 1s ease-out 1s both;
}
@keyframes tagIn {
  from { opacity: 0; letter-spacing: 6px; }
}
.mn-sheet {
  box-sizing: border-box;
  position: relative;
  margin-top: auto;
  width: 100%;
  max-width: 520px;
  padding: 16px 16px calc(18px + env(safe-area-inset-bottom, 0px));
  border-radius: 22px 22px 0 0;
  background: linear-gradient(180deg, rgba(16, 32, 42, .86), rgba(9, 19, 26, .97));
  border-top: 1px solid rgba(255, 211, 107, .35);
  box-shadow: 0 -10px 40px rgba(0, 0, 0, .45);
  animation: sheetUp .9s cubic-bezier(.2, 1.15, .3, 1) .7s both;
}
@keyframes sheetUp {
  from { transform: translateY(110%); }
}
.mn-row {
  display: grid;
  grid-template-columns: 1.4fr 1fr;
  gap: 10px;
  text-align: left;
}
.mn-box h3 {
  margin: 0 0 8px 2px;
  font-size: 13px;
  font-weight: 600;
  opacity: .65;
}
.mn-dif {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  padding: 9px 10px;
  margin-bottom: 7px;
  border-radius: 12px;
  background: rgba(255, 255, 255, .06);
  color: #f4efe2;
  border: 2px solid transparent;
  text-align: left;
  font-weight: 700;
  animation: rowIn .5s ease-out both;
}
.mn-dif:nth-of-type(1) { animation-delay: 1.1s; }
.mn-dif:nth-of-type(2) { animation-delay: 1.2s; }
.mn-dif:nth-of-type(3) { animation-delay: 1.3s; margin-bottom: 0; }
@keyframes rowIn {
  from { opacity: 0; transform: translateX(-24px); }
}
.mn-pips {
  flex: none;
  display: flex;
  gap: 3px;
  align-items: flex-end;
}
.mn-pips i {
  width: 5px;
  border-radius: 2px;
  background: rgba(255, 255, 255, .18);
}
.mn-pips i:nth-child(1) { height: 8px; }
.mn-pips i:nth-child(2) { height: 12px; }
.mn-pips i:nth-child(3) { height: 16px; }
.mn-pips i.f { background: var(--d); box-shadow: 0 0 6px var(--d); }
.mn-dif small {
  display: block;
  font-weight: 400;
  font-size: 11.5px;
  opacity: .7;
  margin-top: 1px;
}
#menu .mn-dif.on {
  border-color: var(--d);
  background: rgba(255, 255, 255, .13);
  color: #fff;
  box-shadow: 0 0 18px -4px var(--d);
}
.mn-dif.dim {
  opacity: .35;
}
#mnTut {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 6px;
  border-radius: 14px;
  padding: 12px 8px;
  margin-top: 25px;
  background: linear-gradient(160deg, rgba(63, 185, 138, .22), rgba(255, 255, 255, .05));
  border: 2px solid rgba(63, 185, 138, .45);
  color: #f4efe2;
  text-align: center;
  font-weight: 800;
  font-size: 16px;
  overflow: hidden;
  animation: rowIn .5s ease-out 1.4s both;
}
#mnTut svg {
  width: 48px;
  height: 48px;
  animation: bookBob 2.6s ease-in-out infinite;
}
@keyframes bookBob {
  0%, 100% { transform: translateY(0) rotate(-4deg); }
  50% { transform: translateY(-4px) rotate(4deg); }
}
#mnTut small {
  font-weight: 400;
  font-size: 11.5px;
  opacity: .8;
  line-height: 1.3;
}
#menu #mnTut.on {
  color: #fff;
  border-color: #ffd36b;
  background: linear-gradient(160deg, rgba(255, 211, 107, .32), rgba(60, 44, 10, .7));
  box-shadow: 0 0 22px -4px #ffd36b;
}
#mnTut .mn-check {
  position: absolute;
  top: 7px;
  right: 7px;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  border: 2px solid rgba(255, 255, 255, .5);
  font-size: 13px;
  line-height: 16px;
  color: transparent;
}
#mnTut.on .mn-check {
  background: #ffd36b;
  border-color: #ffd36b;
  color: #12252e;
}
#mnGo {
  position: relative;
  overflow: hidden;
  margin-top: 14px;
  width: 100%;
  padding: 16px;
  font-size: 19px;
  font-weight: 800;
  letter-spacing: .3px;
  border-radius: 14px;
  background: linear-gradient(180deg, #ffc955, #f2b134 55%, #dc9a1f);
  color: #12252e;
  box-shadow: 0 6px 0 #9c6714, 0 0 0 0 rgba(242, 177, 52, .6), 0 14px 28px rgba(0, 0, 0, .4);
  animation: rowIn .5s ease-out 1.5s both, goPulse 2.2s ease-in-out 2s infinite;
}
#mnGo::after {
  content: '';
  position: absolute;
  top: 0;
  bottom: 0;
  left: -40%;
  width: 35%;
  background: linear-gradient(100deg, transparent, rgba(255, 255, 255, .65), transparent);
  transform: skewX(-20deg);
  animation: sweep 3s ease-in-out 2.2s infinite;
}
@keyframes sweep {
  0% { left: -40%; }
  45%, 100% { left: 120%; }
}
@keyframes goPulse {
  0%, 100% { box-shadow: 0 6px 0 #9c6714, 0 0 0 0 rgba(242, 177, 52, .55), 0 14px 28px rgba(0, 0, 0, .4); }
  50% { box-shadow: 0 6px 0 #9c6714, 0 0 0 10px rgba(242, 177, 52, 0), 0 14px 28px rgba(0, 0, 0, .4); }
}
#mnGo:active {
  transform: translateY(3px);
}
#mnCont {
  margin-top: 10px;
  width: 100%;
  padding: 12px;
  border-radius: 12px;
  background: rgba(255, 255, 255, .1);
  color: #f4efe2;
}
#mnCont[hidden] {
  display: none;
}
@media (prefers-reduced-motion: reduce) {
  #menu *, #menu { animation: none !important; }
}
/* ===== Öğretici rehber kartı ===== */
#coach {
  margin: 10px 0 2px;
  padding: 12px 14px;
  border-radius: 12px;
  background: #12252e;
  color: #f4efe2;
  border-left: 5px solid #f2b134;
  box-shadow: 0 6px 18px rgba(0, 0, 0, .2);
  animation: popIn .25s ease-out;
}
#coach[hidden] {
  display: none;
}
#coach .ch-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 12px;
  opacity: .7;
  margin-bottom: 4px;
}
#coach .ch-top button {
  flex: none;
  padding: 2px 8px;
  font-size: 12px;
  background: transparent;
  color: #f4efe2;
  text-decoration: underline;
}
#coach b {
  display: block;
  font-size: 16px;
  margin-bottom: 4px;
  color: #ffd36b;
}
#coach p {
  margin: 0;
  font-size: 14.5px;
  line-height: 1.45;
}
#coach .ch-next {
  margin-top: 10px;
  width: 100%;
  background: #f2b134;
  color: #12252e;
}
.tut-hl {
  animation: tutPulse 1.1s ease-in-out infinite;
  position: relative;
  z-index: 5;
}
@keyframes tutPulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(242, 177, 52, .9); }
  50% { box-shadow: 0 0 0 7px rgba(242, 177, 52, 0); }
}
#eomenu {
  margin-top: 14px;
  background: transparent;
  color: #fff;
  text-decoration: underline;
  font-size: 15px;
  animation: eoFade .6s ease-out 1.4s both;
}

/* ===== Online: sayaç ve lobi ===== */
#tmr {
  position: absolute;
  left: 8px;
  top: 8px;
  z-index: 6;
  padding: 5px 10px;
  border-radius: 999px;
  background: rgba(10, 22, 30, .85);
  color: #fff;
  font-weight: 700;
  font-size: 13px;
  border: 2px solid var(--tc, #f2b134);
}
#tmr[hidden] {
  display: none;
}
#tmr.low {
  animation: tutPulse .8s ease-in-out infinite;
  color: #ffb3b3;
}
#mnOn {
  margin-top: 10px;
  width: 100%;
  padding: 13px;
  border-radius: 12px;
  background: rgba(63, 185, 138, .18);
  border: 2px solid rgba(63, 185, 138, .6);
  color: #f4efe2;
  font-weight: 700;
  font-size: 16px;
  animation: rowIn .5s ease-out 1.6s both;
}
#mnInst {
  margin-top: 8px;
  width: 100%;
  padding: 11px;
  border-radius: 12px;
  background: rgba(242, 177, 52, .16);
  border: 2px solid rgba(242, 177, 52, .6);
  color: #f4efe2;
  font-weight: 700;
  font-size: 15px;
}
#mnInst[hidden] {
  display: none;
}
#onl {

// ======================================================================
// 1. TEMEL AYARLAR
// ======================================================================
// W,H: harita boyutu (hücre); S: hücre başına piksel; N: bölge sayısı;
// PM: en fazla devlet sayısı (bölünmelerle artar); P: şu anki devlet sayısı.

const W = 330;
const H = 184;

const N = 72;
const PM = 8;

const COL = ['#f2b134', '#e5566d', '#8b7be8', '#3fb98a', '#e47fc4', '#9b6b45', '#3d5fbf', '#2fb0c4', '#9aa3a8'];

// Ana harita tuvali (c = çizim bağlamı)

cv.height = H * S;
const $ = id => document.getElementById(id) || { style: {} };
const sleep = ms => new Promise(r => setTimeout(r, ms));
// ======================================================================
// 2. OYUN DURUMU — değişkenler sözlüğü
// ======================================================================
// cell[i]  : her harita hücresinin bölge numarası (-1 = deniz)

// Performans: fbm(x/sc, y/sc, s) ile birebir aynı sonucu verir ama kafes noktalarını
// bir kez hesaplayıp saklar (harita üretiminde aynı noktalar binlerce kez soruluyordu).
function fbmGrid(sc, s) {

    const nx = Math.ceil(W / sc * m) + 3;
    const ny = Math.ceil(H / sc * m) + 3;
    const tb = new Float64Array(nx * ny);
    for (let yi = 0; yi < ny; yi++)
      for (let xi = 0; xi < nx; xi++)

    return { m, ss, nx, ny, tb };

    const yi = Math.floor(y);
    if (xi < 0 || yi < 0 || xi + 1 >= o.nx || yi + 1 >= o.ny)
      return vn(x, y, o.ss);
    const xf = x - xi;
    const yf = y - yi;
    const u = xf * xf * (3 - 2 * xf);
    const v = yf * yf * (3 - 2 * yf);
    const tb = o.tb;
    const k = yi * o.nx + xi;
    const a = tb[k];
    const b = tb[k + 1];
    const e = tb[k + o.nx];
    const f = tb[k + o.nx + 1];
    return a + (b - a) * u + (e - a) * v + (a - b - e + f) * u * v;

    for (let k = 0; k < L.length && c0 < 3; k += st) {
      const i = L[k];
      const x = i % W;
      const y = (i / W) | 0;
      const dx = x - cx;
      const dy = y - cy;
      const d = Math.hypot(dx, dy) || 1;
      for (const r of [4, 5, 3, 6]) {
        const xx = Math.round(x + dx / d * r);
        const yy = Math.round(y + dy / d * r);
        if (xx < 1 || yy < 1 || xx >= W - 1 || yy >= H - 1 || cell[yy * W + xx] >= 0)
          continue;
        const px = (xx + .5) * S;
        const py = (yy + .5) * S;
        if (pts.some(([a, b]) => Math.hypot(a - px, b - py) < 12))
          break;
        pts.push([px, py]);
        c0++;

// Haritanın panellerle örtülmeyen serbest alanı: genişlik/yükseklik ve üst/sağ/alt boşluklar.
function zins() {
  const w = mw.clientWidth || innerWidth;
  const h = mw.clientHeight || innerHeight;
  if (document.body.classList.contains('mbg'))
    return { w, h, t: 0, r: 0, b: 0, fw: w, fh: h };
  const T = document.getElementById('hudT');
  const B = document.getElementById('hudB');
  const t = T ? T.offsetHeight : 0;
  let r = 0;
  let b = 0;
  const bw = B ? B.offsetWidth : 0;
  if (bw && bw < w * .6)
    r = bw;
  else if (B)
    b = B.offsetHeight;
  return { w, h, t, r, b, fw: Math.max(80, w - r), fh: Math.max(80, h - t - b) };
}
// Tüm harita serbest alana sığar (en uzak görünüm).
const zmin = () => {
  const G = zins();
  return Math.min(G.fw / G.w, G.fh / (G.w * H / W));
};
// Serbest alanı tamamen dolduran yakınlık.
const zfill = () => {
  const G = zins();
  return Math.max(G.fw / G.w, G.fh / (G.w * H / W));
};
const zmax = () => Math.max(3.5, zfill() * 1.4);
const zclamp = k => Math.min(zmax(), Math.max(zmin(), k));
// Oyun başında kullanılan rahat okuma yakınlığı.
const zread = () => Math.max(zfill(), .7 * W * S / (mw.clientWidth || innerWidth));
function focusOn(t, k) {
  const G = zins();
  zk = zclamp(k || zk);
  const cw = G.w * zk;
  const ch = G.w * H / W * zk;
  const [cx, cy] = cen[t];
  zx = G.fw / 2 - cx / W * cw;
  zy = G.t + G.fh / 2 - cy / H * ch;
  zapply();
}

// Bir hücrenin 4 komşusu (harita kenarında olmayanlar). Performans: tek dizi, filtre yok.
const nb = i => {
  const x = i % W;
  const r = [];
  if (x > 0)
    r.push(i - 1);
  if (x < W - 1)
    r.push(i + 1);
  if (i >= W)
    r.push(i - W);
  if (i < W * (H - 1))
    r.push(i + W);
  return r;
};
// Fethedilen bölgenin renginin yavaşça yayılma animasyonu.
async function spread(a, t, old, n = 24) {
  const idx = regCells(t);
  for (const i of idx)
    ov[i] = old;
  const q = [];
  const seen = new Set();
  idx.forEach(i => {
    if (nb(i).some(j => cell[j] >= 0 && cell[j] != t && own[cell[j]] == own[a])) {
      q.push(i);
      seen.add(i);
    }
  });
  for (let k = 0; k < q.length; k++)
    nb(q[k]).forEach(j => {
      if (cell[j] == t && !seen.has(j)) {
        seen.add(j);
        q.push(j);
      }
    });
  const rest = idx.filter(i => !seen.has(i));
  const [ax, ay] = cen[a];
  rest.sort((p, r) => Math.hypot(p % W - ax, ((p / W) | 0) - ay) - Math.hypot(r % W - ax, ((r / W) | 0) - ay));
  rest.forEach(i => q.push(i));
  const step = Math.ceil(q.length / n);
  for (let k = 0; k < q.length; k += step) {
    q.slice(k, k + step).forEach(i => ov[i] = -1);
    uiSoon();
    await sleep(40);
  }
}

// Düşmandan en uzak (en güvenli) bölgeyi seçer — yeni başkent için.
function safest(p, set) {
  let b = -1e9;
  let bi = set[0];
  for (const u of set) {
    let d = 99;
    for (let v = 0; v < N; v++)
      if (own[v] != p && own[v] != NEU && !friend(p, own[v]) && HD[u][v] < d)
        d = HD[u][v];
    const v2 = d * 3 + arm[u] * .15 + (tw[u] ? 1 : 0) + (wall[u] ? 1 : 0);
    if (v2 > b) {
      b = v2;
      bi = u;
    }
  }
  return bi;
}
// Bir devletin topraklarını iki yarıya böler.
function halves(rest, s1, s2) {
  const A = [s1];

  un.delete(s1);
  un.delete(s2);
  while (un.size) {
    const G = A.length <= B.length ? A : B;
    const O = G == A ? B : A;

// Paneldeki yapı düğmelerinin işlemleri (isyandaki bölgeye inşa yapılamaz).
// Botun ittifak teklifini kabul etme olasılığı: ona saldırdıysan düşer, zayıfsa korunmak için artar.
function allyChance(q) {
  let c = .55 - .12 * (hp[q] || 0);
  if (cnt(q) < cnt(0) * .6)
    c += .2;
  else if (cnt(q) > cnt(0))
    c -= .15;
  if (bp[q] && bp[q].some(v => v > 0))
    c -= .2;
  return Math.max(.1, Math.min(.85, c));
}
function build(t) {
  const lg = s => $('log').textContent = s;

    bd = null;
    return lg('İsyan bastırılmadan bu bölgeye bir şey inşa edemezsin.');
  }
  if (bd == 'a') {
    const q = own[t];
    if (q == 0)
      return lg('İttifak için bir krallık seç.');
    if (ally[q] > 0)
      return lg(`${PN[q]} ile zaten ittifaktasın.`);
    if (tcd[q] == rd)
      return lg(`${PN[q]} bu tur zaten bir teklifini reddetti.`);
    bd = null;
    if (Math.random() > allyChance(q)) {
      tcd[q] = rd;
      pulse(t, '#e5566d');
      fl.push({ t, dx: 0, txt: 'Reddetti', col: '#ff8a8a', t0: performance.now() });
      return lg(`${PN[q]} ittifak teklifini reddetti. Bir sonraki tur tekrar deneyebilirsin.`);
    }
    ally[q] = 6;
    tru[q] = 0;
    pulse(t, '#3fb98a');
    fl.push({ t, dx: 0, txt: 'İttifak!', col: '#7ef0c0', t0: performance.now() });
    return lg(`${PN[q]} teklifini kabul etti: 6 tur ittifak kuruldu.`);
  }
  if (bd == 'u') {
    if (own[t] != 0)
      return lg('Sadece kendi bölgene kurabilirsin.');
    if (tw[t])
      return lg('Burada zaten kule var.');
    if (gold[0] < TWC)
      return lg(`Okçu Kulesi ${TWC} altın. Yeterli altının yok.`);
    gold[0] -= TWC;
    tw[t] = 1;
    bd = null;
    pulse(t, '#cfd6da');
    return lg(`${NM[t]}: Okçu Kulesi kuruldu.`);
  }
  if (bd == 'd') {
    if (own[t] != 0)
      return lg('Sadece kendi bölgene kurabilirsin.');
    if (!dock[t])
      return lg('İskele sadece kıyıdaki bölgeye kurulur.');
    if (dk[t])
      return lg('Burada zaten iskele var.');
    if (gold[0] < DC)
      return lg(`İskele ${DC} altın. Yeterli altının yok.`);
    gold[0] -= DC;
    dk[t] = 1;
    bd = null;
    pulse(t, '#c8a26b');
    return lg(`${NM[t]}: iskele kuruldu.`);
  }
  if (bd == 'm') {
    if (own[t] != 0)
      return lg('Sadece kendi bölgene kurabilirsin.');
    if (mn[t])
      return lg('Burada zaten maden var.');
    const c = MC(mn.filter((m, i) => m && own[i] == 0).length);
    if (gold[0] < c)
      return lg(`Maden ${c} altın. Yeterli altının yok.`);
    gold[0] -= c;
    mn[t] = 1;
    bd = null;
    pulse(t, '#ffd36b');
    return lg(`${NM[t]}: maden kuruldu. Her tur +${MI} altın.`);
  }
  if (own[t] != 0)
    return lg('Sadece kendi bölgene inşa edebilirsin.');
  if (bd == 'b') {
    if (bar[t])
      return lg('Burada zaten kışla var.');
    if (gold[0] < BC)
      return lg('Yeterli altının yok.');
    gold[0] -= BC;
    bar[t] = 1;
    pulse(t, '#ffffff');
    lg(`${NM[t]}: kışla kuruldu. Sonraki turlarda +3 asker.`);
  }
  else {
    const c = WC(wall[t]);
    if (wall[t] >= 2)
      return lg('Sur en üst seviyede.');
    if (gold[0] < c)
      return lg('Yeterli altının yok.');
    gold[0] -= c;
    wall[t]++;
    wallStart(t);
    pulse(t, '#cfe3ea');
    lg(`Başkent surları seviye ${wall[t]} oldu.`);
  }
  bd = null;
}

function soldierFig(x, y, dir, col, sw, blk, walk) {

  g.lineTo(3.5, 4);

  g.closePath();

  g.moveTo(1.5, -3);
  g.lineTo(hx, hy);
  g.stroke();
  g.strokeStyle = '#eef2f4';
  g.lineWidth = 1.6;

function tutView() {

    return;

  const mr = mw.getBoundingClientRect();

    if (t == null || t < 0 || !cen[t])

    const y = rc.top + cen[t][1] / H * rc.height - mr.top;

// Öğreticinin gösterdiği bölgeleri altın halka ve ok ile işaretler.
function drawTut(s) {
  if (!TUT || !tutT.length)
    return;
  tutT.forEach((t, i) => {
    if (t == null || t < 0 || !cen[t])
      return;
    const x = cen[t][0] * S;
    const y = cen[t][1] * S;
    const r = 20 + Math.sin(s * 5 + i) * 3;
    g.lineWidth = 3;
    g.strokeStyle = '#ffd36b';
    g.globalAlpha = .9;
    g.beginPath();
    g.arc(x, y, r, 0, 7);
    g.stroke();
    g.globalAlpha = .35;
    g.lineWidth = 8;
    g.beginPath();
    g.arc(x, y, r + 4, 0, 7);
    g.stroke();
    g.globalAlpha = 1;
    const ay = y - 34 - Math.abs(Math.sin(s * 4 + i)) * 8;
    g.fillStyle = '#ffd36b';
    g.strokeStyle = '#12252e';
    g.lineWidth = 2;
    g.beginPath();
    g.moveTo(x, ay + 12);
    g.lineTo(x - 9, ay);
    g.lineTo(x - 3.5, ay);
    g.lineTo(x - 3.5, ay - 10);
    g.lineTo(x + 3.5, ay - 10);
    g.lineTo(x + 3.5, ay);
    g.lineTo(x + 9, ay);
    g.closePath();
    g.fill();
    g.stroke();
  });
}

function seededRng(seed) {
  let a = seed >>> 0;
  return () => {
    a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

function FirebaseNet(cfg) {

            cur.seats = seats;
            return cur;

    },
    watchMeta(code, cb) {

    },
    setMeta: (code, patch) => db.ref(`rooms/${code}/meta`).update(patch),
    pushState: (code, str) => db.ref(`rooms/${code}/state`).set(str),
    watchState(code, cb) {
      const r = db.ref(`rooms/${code}/state`);
      const f = s => s.val() && cb(s.val());

      subs.push(() => r.off('value', f));

    presence(code, cb) {

      subs.push(() => { r.off('value', f); me.remove(); });
    },

    },

}
function LocalNet() {
  const bc = new BroadcastChannel('fetih-net');
  const subs = [];
  let hb = 0;
  const K = (c, k) => `fnet_${c}_${k}`;
  const get = k => {
    try {
      return JSON.parse(localStorage.getItem(k));
    }
    catch (e) {
      return null;
    }
  };
  const local = new EventTarget();
  const put = (k, v) => {
    const j = JSON.stringify(v);
    localStorage.setItem(k, j);
    bc.postMessage({ k, j });
    setTimeout(() => local.dispatchEvent(new MessageEvent('message', { data: { k, j } })), 0);
  };
  const on = f => {
    bc.addEventListener('message', f);
    local.addEventListener('message', f);
    return () => {
      bc.removeEventListener('message', f);
      local.removeEventListener('message', f);
    };
  };
  const n = {
    uid: null,
    async init() {
      n.uid = sessionStorage.getItem('fnet_uid') || ('u' + Math.random().toString(36).slice(2, 9));
      sessionStorage.setItem('fnet_uid', n.uid);
    },
    now: () => Date.now(),
    async create(code, meta) {
      if (get(K(code, 'meta')))
        return false;
      put(K(code, 'meta'), meta);
      return true;
    },
    async join(code, name) {
      const cur = get(K(code, 'meta'));
      if (!cur)
        throw new Error('Oda bulunamadı.');
      cur.seats = cur.seats || {};
      for (const k in cur.seats)
        if (cur.seats[k] && cur.seats[k].uid == n.uid)
          return +k;
      if (cur.status != 'lobby')
        throw new Error('Oyun çoktan başlamış.');
      for (let i = 0; i < 4; i++)
        if (!cur.seats[i]) {
          cur.seats[i] = { uid: n.uid, name };
          put(K(code, 'meta'), cur);
          return i;
        }
      throw new Error('Oda dolu.');
    },
    watchMeta(code, cb) {
      const k = K(code, 'meta');
      const f = e => e.data && e.data.k == k && cb(JSON.parse(e.data.j));
      subs.push(on(f));
      setTimeout(() => cb(get(k)), 0);
    },
    setMeta(code, patch) {
      const cur = get(K(code, 'meta')) || {};
      put(K(code, 'meta'), Object.assign(cur, patch));
    },
    pushState: (code, str) => put(K(code, 'state'), str),
    watchState(code, cb) {
      const k = K(code, 'state');
      const f = e => e.data && e.data.k == k && cb(JSON.parse(e.data.j));
      subs.push(on(f));
      setTimeout(() => {
        const v = get(k);
        if (v)
          cb(v);
      }, 0);
    },
    presence(code, cb) {
      const beat = () => {
        const on = get(K(code, 'on')) || {};
        on[n.uid] = Date.now();
        put(K(code, 'on'), on);
        cb(new Set(Object.keys(on).filter(u => Date.now() - on[u] < 7000)));
      };
      beat();
      hb = setInterval(beat, 2500);
      subs.push(() => clearInterval(hb));
    },
    leave() {
      subs.splice(0).forEach(f => f());
    },
  };
  return n;
}

const PARR = ['gold', 'cap', 'att', 'won', 'pen', 'mvd', 'spl', 'ref', 'bt', 'tru', 'hp', 'hb', 'tcd', 'rev', 'sup', 'ally'];
const GARR = { own: () => own, arm: () => arm, wall: () => wall, bar: () => bar, mn: () => mn, arch: () => arch, tw: () => tw, spy: () => spy, dk: () => dk, shS: () => shS, shL: () => shL, shUsed: () => shUsed, sfire: () => sfire, shot: () => shot, inc: () => inc, ib: () => ib, ruin: () => ruin, mine: () => mine };
const PVARS = { gold: () => gold, cap: () => cap, att: () => att, won: () => won, pen: () => pen, mvd: () => mvd, spl: () => spl, ref: () => ref, bt: () => bt, tru: () => tru, hp: () => hp, hb: () => hb, tcd: () => tcd, rev: () => rev, sup: () => sup, ally: () => ally };
function swapIdx(a) {
  if (!ONLINE || !myG)

}
function snap() {

  for (const k in PVARS)
    o[k] = swapIdx(PVARS[k]());
  o.bt = o.bt.map(x => SW(x));
  const bpS = swapIdx(bp).map(r => swapIdx(r));
  o.bp = bpS;
  persp[myG] = { rv: rv.slice(), kc: [...kc], miss: miss.map(m => ({ t: m.t, a: m.a, back: m.back || 0 })) };

}
function applySnap(o) {
  const oldOwn = own ? own.slice() : null;

    if (mine[i])
      mine[i].t0 = 0;
  }
  for (const k in PVARS) {
    const arr = swapIdx(o[k] || []);
    const tgt = PVARS[k]();
    for (let i = 0; i < PM; i++)
      tgt[i] = arr[i] == null ? 0 : arr[i];
  }
  for (let i = 0; i < PM; i++)
    bt[i] = SW(bt[i]);
  const bpL = swapIdx(o.bp || []).map(r => swapIdx(r || []));
  for (let i = 0; i < PM; i++)
    for (let j = 0; j < PM; j++)
      bp[i][j] = (bpL[i] && bpL[i][j]) || 0;

  const me = persp[myG];
  if (me) {
    for (let i = 0; i < N; i++)

    if (!writer)

  ui();
}
function onState(str) {
  let o;
  try {
    o = typeof str == 'string' ? JSON.parse(str) : str;
  }
  catch (e) {
    return;
  }
  if (!o || o.v != 3)
    return;
  if (!ONLINE) {
    pendingState = o;
    return;
  }
  if (o.by == NET.uid || o.ver <= sVer)
    return;
  sVer = Math.max(sVer, o.ver);
  lastRecvAt = Date.now();
  applySnap(o);
  const pn = performance.now();
  if (o.ev) {
    (o.ev.nav || []).forEach(e => {
      e.rx = 1;
      e.t0 = pn + (e.t0 - o.ev.pn);
      nav.push(e);
    });
    (o.ev.fl || []).forEach(e => {
      e.rx = 1;
      e.t0 = pn + (e.t0 - o.ev.pn);
      fl.push(e);
    });
  }
  if (cnt(0) == 0 && !dr)
    onlineLost();
  if (!dr && /başkentini seç|başkent seçiyor/.test($('log').textContent))
    $('log').textContent = 'Dağıtım bitti, savaş başlıyor!';
  if (turn == 0 && !over) {
    writer = true;
    busy = false;
    if (!dr && turnSeq != seenSeq)
      myTurnBegin();
    if (dr)
      $('log').textContent = 'Sıra sende: başkentini seç (kıtadaki bir bölgeye dokun).';
  }
  else {
    writer = false;
    busy = true;
  }
  if (o.over && rivalsGone() && !document.getElementById('eov'))
    endScreen(true);
  ui();
}
function myTurnBegin() {
  seenSeq = turnSeq;
  ext = 0;
  supT.clear();
  spyHome();
  banner('Senin sıran', COL[0]);
  if (!$('log').textContent)
    $('log').textContent = 'Sıra sende.';
}
function onlineLost() {
  if (lostShown)
    return;
  lostShown = true;
  setTimeout(() => endScreen(false), 600);
}
// --- Sıra sayacı: süre dolunca sıra kendiliğinden geçer; kurucu cihaz takılan sıraları kurtarır ---
function autoEndTurn() {
  if (!ONLINE || busy || turn != 0 || !writer || over)
    return;
  if (dr) {
    onlineCapPick(botPick(0));
    return;
  }
  autoPool(0);
  sel = null;
  mv = false;
  busy = true;
  pop.hidden = true;
  next();
}
function autoPool(p) {
  const brd = [...Array(N).keys()].filter(t => own[t] == p && !inc[t] && [...adj[t]].some(b => own[b] != p));
  const L = brd.length ? brd : [...Array(N).keys()].filter(t => own[t] == p && !inc[t]);
  while (pool > 0 && L.length) {
    arm[L[Math.floor(Math.random() * L.length)]]++;
    pool--;
  }
  pool = 0;
  phase = 'a';
}
let onSet = new Set();
const amHost = () => {
  if (!ROOM || !ROOM.seats)
    return false;
  for (let i = 0; i < 4; i++) {
    const st = ROOM.seats[i];
    if (st && onSet.has(st.uid))
      return st.uid == NET.uid;
  }
  return false;
};
setInterval(() => {
  const el = document.getElementById('tmr');
  if (!ONLINE || over || !cen) {
    el.hidden = true;
    return;
  }
  const left = deadline ? Math.max(0, Math.ceil((deadline - netNow()) / 1000)) : 0;
  if (deadline && HUM.has(turn)) {
    el.hidden = false;
    el.textContent = `⏱ ${left} sn · ${turn == 0 ? 'Sen' : PN[turn]}`;
    el.style.setProperty('--tc', COL[turn]);
    el.classList.toggle('low', left <= 10);
  }
  else {
    el.hidden = !(!HUM.has(turn) && busy);
    el.textContent = `${PN[turn]} oynuyor`;
    el.style.setProperty('--tc', COL[turn] || '#9aa3a8');
    el.classList.remove('low');
  }
  if (turn == 0 && deadline && netNow() > deadline)
    autoEndTurn();
  // Kurucu cihaz: süresi çoktan dolmuş ya da donmuş sıraları kurtarır.
  if (amHost() && turn != 0 && !writer) {
    const seat = ROOM && ROOM.seats ? ROOM.seats[SW(turn)] : null;
    const gone = HUM.has(turn) && seat && !onSet.has(seat.uid) && !dr && deadline && netNow() > deadline - TURN_SEC * 1000 + 5000;
    const late = deadline && HUM.has(turn) && netNow() > deadline + 9000;
    const stuck = !HUM.has(turn) && Date.now() - lastRecvAt > 45000;
    if (late || stuck || gone) {
      writer = true;
      busy = true;
      if (dr) {
        const p = turn;
        const t = botPick(p);
        onlineCapClaim(p, t);
      }
      else if (gone)
        ai(turn);
      else if (late) {
        autoPool(turn);
        next();
      }
      else
        ai(turn);
    }
  }
}, 1000);
// --- Online bölge seçimi: önce insanlar başkentini seçer, kalanlar otomatik dağıtılır ---
function onlineCapPick(t) {
  if (!dr || turn != 0 || cap[0] >= 0)
    return;
  if (own[t] != NEU)
    return void ($('log').textContent = 'Bu bölge zaten alındı.');
  if (t >= N - NI)
    return void ($('log').textContent = 'Başkent kıtada olmalı, adaya kurulamaz.');
  onlineCapClaim(0, t);
}
function onlineCapClaim(p, t) {
  own[t] = p;
  arm[t] = 5;
  cap[p] = t;
  fl.push({ t, dx: 0, txt: p == 0 ? 'Başkent' : PN[p], col: '#fff', t0: performance.now() });
  pulse(t, COL[p]);
  fadeTo(t, NEU, 8, 30);
  const order = [...Array(P).keys()].map(g => SW(g)).filter(q => HUM.has(q) && cap[q] < 0);
  if (order.length) {
    turn = order[0];
    deadline = netNow() + 30000;
    netHandoff();
    return;
  }
  onlineDistribute();
}
function onlineDistribute() {
  writer = true;
  busy = true;
  for (let g = 0; g < P; g++) {
    const p = SW(g);
    if (cap[p] < 0) {
      const t = botPick(p);
      own[t] = p;
      arm[t] = 5;
      cap[p] = t;
      fadeTo(t, NEU, 10, 40);
    }
  }
  let g = 0;
  let guard = 0;
  while (own.includes(NEU) && guard++ < 400) {
    const p = SW(g % P);
    const t = botPick(p);
    own[t] = p;
    arm[t] = 3;
    fadeTo(t, NEU, 10, 40);
    g++;
  }
  dr = false;
  hl = 'Dağıtım bitti, savaş başlıyor!';
  turn = SW(0);
  start(turn);
}
// --- Lobi ekranı ---
const onl = document.getElementById('onl');
const onc = document.getElementById('onc');
const esc = x => String(x).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
let onDif = 1;
let onSec = 60;
function netMake() {
  if (/[?&]net=local/.test(location.search))
    return LocalNet();
  if (/[?&]net=fbmock/.test(location.search))
    return FirebaseNet({ projectId: 'mock' });
  if (FIREBASE_CONFIG)
    return FirebaseNet(FIREBASE_CONFIG);
  return null;
}
function onShow(html) {
  onc.innerHTML = html;
  onl.hidden = false;
}
function onHome(err) {
  const nm = (() => {
    try {
      return localStorage.getItem('fetih_name') || '';
    }
    catch (e) {
      return '';
    }
  })();
  onShow(`<h2>Online oyna</h2><p>Arkadaşlarınla aynı haritada savaş. Boş kalan yerleri botlar doldurur. Her oyuncunun sırası ${onSec} saniye sürer.</p>
    <label for="onName">Adın</label><input id="onName" maxlength="12" value="${esc(nm)}" placeholder="Örnek: Fatih">
    <div class="on-row"><button class="on-main" id="onCreate" style="flex:1">Oda kur</button></div>
    <label for="onCode">Arkadaşının oda kodu</label>
    <div class="on-row"><input id="onCode" maxlength="5" placeholder="KOD" style="text-transform:uppercase;letter-spacing:4px"><button class="on-sec" id="onJoin">Katıl</button></div>
    <div class="on-err" id="onErr">${esc(err || '')}</div>
    <div class="on-row"><button class="on-sec" id="onBack" style="flex:1">Geri</button></div>`);
  const name = () => (document.getElementById('onName').value.trim() || 'Oyuncu').slice(0, 12);
  const keep = () => {
    try {
      localStorage.setItem('fetih_name', name());
    }
    catch (e) { }
  };
  document.getElementById('onBack').onclick = () => onl.hidden = true;
  document.getElementById('onCreate').onclick = async () => {
    keep();
    try {
      await netReady();
      let code = '';
      for (let k = 0; k < 8; k++) {
        code = Array.from({ length: 4 }, () => 'ABCDEFGHJKLMNPRSTUVYZ'[Math.floor(Math.random() * 21)]).join('');
        if (await NET.create(code, { host: NET.uid, status: 'lobby', created: netNow(), dif: onDif, sec: onSec, seats: { 0: { uid: NET.uid, name: name() } } }))
          break;
        code = '';
      }
      if (!code)
        throw new Error('Oda kurulamadı, tekrar dene.');
      enterRoom(code, 0);
    }
    catch (e) {
      onHome(e.message);
    }
  };
  document.getElementById('onJoin').onclick = async () => {
    keep();
    const code = document.getElementById('onCode').value.trim().toUpperCase();
    if (code.length < 4)
      return onHome('Oda kodunu yaz.');
    try {
      await netReady();
      const seat = await NET.join(code, name());
      enterRoom(code, seat);
    }
    catch (e) {
      onHome(e.message);
    }
  };
}
async function netReady() {
  if (NET)
    return;
  const n = netMake();
  if (!n)
    throw new Error('Online sunucu henüz kurulmadı. Firebase ayarları eklenince bu düğme çalışacak.');
  await n.init();
  NET = n;
}
let mySeat = 0;
function enterRoom(code, seat) {
  RC = code;
  mySeat = seat;
  try {
    localStorage.setItem('fetih_room', code);
  }
  catch (e) { }
  NET.presence(code, s => {
    onSet = s;
    if (!ONLINE)
      drawLobby();
  });
  NET.watchMeta(code, m => {
    if (!m)
      return;
    ROOM = m;
    if (m.status == 'play' && !ONLINE)
      onlineBegin(m);
    else if (!ONLINE)
      drawLobby();
  });
  NET.watchState(code, onState);
  drawLobby();
}
function drawLobby() {
  if (!ROOM)
    return onShow('<h2>Odaya bağlanılıyor…</h2>');
  const host = ROOM.host == NET.uid;
  const seats = ROOM.seats || {};
  const rows = [0, 1, 2, 3].map(i => {
    const st = seats[i];
    const nm = st ? esc(st.name) + (st.uid == NET.uid ? ' (sen)' : '') : 'Bot (boş yer)';
    const on = st ? (onSet.has(st.uid) ? 'bağlı' : 'bağlantı yok') : '';
    return `<div class="on-seat" style="--c:${COL0[i]};animation-delay:${i * .06}s"><i></i><span>${nm}</span><small>${on}</small></div>`;
  }).join('');
  const difs = ['Kolay', 'Normal', 'Zor'];
  onShow(`<h2>Oda kodu</h2><p>Bu kodu arkadaşlarına gönder; "Odaya katıl" ile girsinler.</p><div class="on-code">${esc(RC)}</div>${rows}
    ${host ? `<label>Botların zorluğu</label><div class="on-opts">${difs.map((d, i) => `<button data-d="${i}" class="${(ROOM.dif ?? 1) == i ? 'on' : ''}">${d}</button>`).join('')}</div>
    <label>Sıra süresi</label><div class="on-opts">${[45, 60, 90].map(x => `<button data-s="${x}" class="${(ROOM.sec || 60) == x ? 'on' : ''}">${x} sn</button>`).join('')}</div>
    <div class="on-row"><button class="on-main" id="onStart" style="flex:1">Oyunu başlat</button></div>` : '<p>Oda kurucusunun oyunu başlatması bekleniyor…</p>'}
    <div class="on-row"><button class="on-sec" id="onLeave" style="flex:1">Odadan ayrıl</button></div>`);
  onc.querySelectorAll('[data-d]').forEach(b => b.onclick = () => NET.setMeta(RC, { dif: +b.dataset.d }));
  onc.querySelectorAll('[data-s]').forEach(b => b.onclick = () => NET.setMeta(RC, { sec: +b.dataset.s }));
  const stb = document.getElementById('onStart');
  if (stb)
    stb.onclick = () => NET.setMeta(RC, { status: 'play', seed: Math.floor(Math.random() * 2 ** 31), startAt: netNow() });
  document.getElementById('onLeave').onclick = () => netLeave();
}
function netLeave() {
  if (NET)
    NET.leave();
  ONLINE = false;
  RC = null;
  ROOM = null;
  myG = 0;
  HUM = new Set([0]);
  writer = true;
  for (let i = 0; i < PM; i++) {
    COL[i] = COL0[i];
    PN[i] = PN0[i];
  }
  try {
    localStorage.removeItem('fetih_room');
  }
  catch (e) { }
  onl.hidden = true;
}
function onlineBegin(m) {
  ONLINE = true;
  myG = mySeat;
  TURN_SEC = m.sec || 60;
  DIF = m.dif ?? 1;
  const seats = m.seats || {};
  HUM = new Set();
  for (let g = 0; g < 4; g++)
    if (seats[g])
      HUM.add(SW(g));
  for (let i = 0; i < PM; i++) {
    const g = SW(i);
    COL[i] = COL0[g];
    PN[i] = i == 0 ? 'Sen' : seats[g] && g < 4 ? String(seats[g].name).slice(0, 12) : PN0[g];
  }
  TUT = 0;
  tutHide();
  lostShown = false;
  sVer = 0;
  seenSeq = -1;
  persp = {};
  onl.hidden = true;
  menuEl.hidden = true;
  document.body.classList.remove('mbg');
  const eo = document.getElementById('eov');
  if (eo)
    eo.remove();
  init(true, m.seed);
  demo = false;
  dr = true;
  phase = 'd';
  dnx = 0;
  rd = 0;
  turn = SW(0);
  deadline = netNow() + 30000;
  writer = turn == 0;
  busy = !writer;
  zk = zfill();
  zx = 0;
  zy = 0;
  zapply();
  $('log').textContent = turn == 0 ? 'Online oyun başladı. Başkentini seç: kıtadaki bir bölgeye dokun.' : 'Online oyun başladı. Diğer oyuncular başkent seçiyor…';
  if (m.inited) {
    writer = false;
    busy = true;
    $('log').textContent = 'Oyuna yeniden bağlanılıyor…';
  }
  ui();
  if (writer && !m.inited) {
    netPush();
    NET.setMeta(RC, { inited: true });
  }
  if (pendingState) {
    const ps = pendingState;
    pendingState = null;
    onState(ps);
  }
}
document.getElementById('mnOn').onclick = () => {
  goFull();
  if (ONLINE)
    return;
  onHome('');
};

// ---- Refah göstergesi ----
let lastRef = null;
const rfEl = document.getElementById('refah');
// Refah göstergesi normalde küçük bir rozettir; dokununca büyüyüp kuralları gösterir.
let rfTimer = 0;
function rfOpen(on) {
  clearTimeout(rfTimer);
  rfEl.classList.toggle('mini', !on);
  if (!on)
    document.getElementById('rfInfo').hidden = true;
}
rfEl.onclick = () => {
  const i = document.getElementById('rfInfo');
  const open = rfEl.classList.contains('mini') || i.hidden;
  rfOpen(open);
  i.hidden = !open;
};
// Başka bir yere dokununca refah açıklaması kapanır, gösterge küçülür.
document.addEventListener('pointerdown', e => {
  const i = document.getElementById('rfInfo');
  if (!i.hidden && !(e.target.closest && e.target.closest('#refah,#rfInfo')))
    rfOpen(false);
});
function refahUI() {
  if (!ref || !cen)
    return;
  const v = Math.round(ref[0]);
  rfEl.hidden = !!dr || cnt(0) == 0;
  if (v === lastRef)
    return;
  const col = v >= 70 ? '#3fb98a' : v >= 50 ? '#e0a21f' : v >= 20 ? '#e5566d' : '#c62828';
  rfEl.style.setProperty('--rc', col);
  rfEl.style.setProperty('--v', v);
  rfEl.classList.toggle('crit', v < 20);
  const fill = rfEl.querySelector('.rf-fill');
  const ghost = rfEl.querySelector('.rf-ghost');
  fill.style.height = v + '%';
  rfEl.querySelector('.rf-v').textContent = '%' + v;
  if (lastRef != null && v < lastRef) {
    ghost.style.transition = 'none';
    ghost.style.height = lastRef + '%';
    void ghost.offsetWidth;
    ghost.style.transition = '';
    ghost.style.height = v + '%';
  }
  else
    ghost.style.height = v + '%';
  if (lastRef != null && v != lastRef) {
    // Değişince gösterge birkaç saniyeliğine büyür (eriyen kısım görünsün), sonra küçülür.
    if (rfEl.classList.contains('mini')) {
      rfEl.classList.remove('mini');
      rfTimer = setTimeout(() => {
        if (document.getElementById('rfInfo').hidden)
          rfEl.classList.add('mini');
      }, 2800);
    }
    const d = document.createElement('span');
    d.className = 'rf-d';
    d.textContent = (v > lastRef ? '+' : '−') + Math.abs(v - lastRef);
    d.style.color = v > lastRef ? '#3fb98a' : '#e5566d';
    rfEl.appendChild(d);
    setTimeout(() => d.remove(), 1700);
  }
  lastRef = v;
}
// ---- Telefona uygulama olarak yükleme (oyun kendi sitesinde açıldığında) ----
// Chrome yüklemeye izin verdiğinde menüde "Telefona yükle" düğmesi çıkar.
let instEv = null;
const instBtn = document.getElementById('mnInst');
addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  instEv = e;
  instBtn.hidden = false;
});
instBtn.onclick = async () => {
  if (!instEv)
    return;
  instEv.prompt();
  try {
    await instEv.userChoice;
  }
  catch (e) { }
  instEv = null;
  instBtn.hidden = true;
};
addEventListener('appinstalled', () => {
  instBtn.hidden = true;
});
// Çevrimdışı çalışma için önbellek görevlisi (yalnızca kendi sitesinde, sw.js varsa).
if ('serviceWorker' in navigator && window.isSecureContext && document.querySelector('link[rel=manifest]'))
  navigator.serviceWorker.register('sw.js').catch(() => { });
// Oyunu başlat: arka planda bir harita üret ve ana menüyü göster.
try {
  const v = localStorage.getItem('fetih_dif');
  if (v != null)
    DIF = Math.max(0, Math.min(2, +v || 0));
}
catch (e) { }
init(true);
showMenu(false);
</script>
